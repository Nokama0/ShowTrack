name: Release

# Push a tag like v0.2.8 to build and publish a release with the Windows
# installer, the portable exe and the Android APK. Run manually
# (workflow_dispatch) to build the same artifacts without publishing, as a
# dry run. Bump the version in Cargo.toml + tauri.conf.json before tagging.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# re-triggering a dry run cancels the previous one; real tags each have a
# unique ref so genuine releases never cancel each other
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build

      - name: Assemble Windows assets
        shell: bash
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          mkdir dist
          cp "src-tauri/target/release/bundle/nsis/ShowTrack_${VERSION}_x64-setup.exe" dist/
          cp "src-tauri/target/release/showtrack.exe" "dist/ShowTrack_${VERSION}_x64-portable.exe"

      - name: Hygiene scan
        shell: bash
        run: |
          for f in dist/*.exe; do
            if grep -aoE "***REMOVED***|***REMOVED***|C:\\\\Users\\\\Nokama|G:\\\\Projects" "$f"; then
              echo "::error::identity marker found in $f"; exit 1
            fi
          done
          echo "clean"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri/gen/android
          echo "$KS_B64" | base64 -d > showtrack-release.keystore
          {
            echo "storeFile=showtrack-release.keystore"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri android build --target aarch64

      - name: Assemble Android asset
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          mkdir dist
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "dist/ShowTrack_${VERSION}_arm64.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*

  publish:
    # a tag push publishes the real release; a manual run publishes a DRAFT
    # (safe to delete) so the whole pipeline, publishing included, is testable
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
      - name: Version from tag
        id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/**/*
          fail_on_unmatched_files: true
          draft: ${{ github.ref_type != 'tag' }}
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'dry-run' }}
          name: ${{ github.ref_type == 'tag' && format('ShowTrack {0}', steps.ver.outputs.v) || 'Dry run (draft, safe to delete)' }}
