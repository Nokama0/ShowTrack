name: CI (frontend)

# only runs when the frontend actually changes, so backend-only pushes
# do not spend minutes here
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "static/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "svelte.config.js"
      - "vite.config.*"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "src/**"
      - "static/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "svelte.config.js"
      - "vite.config.*"
      - ".github/workflows/ci-frontend.yml"

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
